[package]
name = "caniot-controller"
version = "0.3.0"
edition = "2021"
description = "CANIOT Rust Controller"
homepage = "https://github.com/lucasdietrich/caniot-rust-controller.git"
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Database is now unconditionally SQLite; removed db-postgres and db-sqlite features.
default = ["ble-copro"]

ble-copro = ["dep:ble-copro-stream-server"]

[dependencies]
# Asynchronous runtime and features
tokio = { version = "1.38.0", features = ["net"] }
tokio-stream = { version = "0.1.15", optional = true }
async-std = "1.12"
async-trait = "0.1"
async-stream = { version = "0.3.5", optional = true }
futures = "0.3"
futures-util = "0.3"

# CAN interface

socketcan = { version = "3.5.0", features = ["tokio", "async-std"] }
embedded-can = "0.4"
# grpc
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
prost-types = "0.13"

# database (always sqlite)
sqlx = { version = "0.8.2", features = [
    "runtime-tokio",
    "macros",

    "sqlite-unbundled",
] }

# Webserver
rocket = { version = "0.5.1", features = ["json"] }

# cli
clap = { version = "4.5.8", features = ["derive"] }

# serialization
serde = { version = "1.0.203", features = ["derive"] }
toml = "1.0"

# logging
env_logger = "0.11"
log = "0.4.22"
syslog = "7.0"

# utils
num = "0.4"
num-derive = "0.4"
num-traits = "0.2"
thiserror = "2.0"
itertools = "0.14"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15.0"

strum = { version = "0.28", features = ["derive"] }
as-any = "0.3"
# sorted-vec = "0.8.3"

# BLE can
[dependencies.ble-copro-stream-server]
git = "https://github.com/lucasdietrich/zephyr-linux-ble-copro.git"
rev = "883b2704578d9214571ac23c5ae348aeb82955c0"
# path = "/home/lucas/zephyrproject-ble/zephyr-linux-ble-copro/ble-copro-stream-server-rs"
optional = true
features = ["tcp-keep-alive", "chrono"]

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = false           # "debuginfo"
debug-assertions = true
overflow-checks = true
panic = 'abort'
incremental = true
rpath = false

[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
debug = true
strip = true
debug-assertions = true
overflow-checks = true
panic = 'abort'
incremental = true
rpath = false
